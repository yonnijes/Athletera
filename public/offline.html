<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Athletera - Sin conexión</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .container { max-width: 400px; }
      h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #0ea5e9; }
      p { font-size: 1rem; line-height: 1.6; color: #94a3b8; margin-bottom: 1.5rem; }
      button {
        background: #0ea5e9;
        color: #fff;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:active { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Sin conexión</h1>
      <p>No se pudo cargar la aplicación. Verifica tu conexión a internet e intenta de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
